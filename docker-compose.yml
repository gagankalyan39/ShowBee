services:
  postgres:
    image: postgres:15-alpine
    container_name: showbee-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: showbee
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: showbee-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/showbee
      PORT: 5001
      JWT_SECRET: showbee_super_secret_jwt_key_2024
      FRONTEND_URL: http://localhost:3000
      ARCHITECTURE_LABEL: monolith
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: showbee-booking-service
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/showbee
      PORT: 5002
      JWT_SECRET: showbee_super_secret_jwt_key_2024
      ARCHITECTURE_LABEL: microservice
      MONOLITH_URL: http://backend:5001
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: showbee-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5001/api
      NEXT_PUBLIC_BOOKING_API_URL: http://localhost:5002/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5001
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - booking-service

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: showbee-prometheus
    restart: always
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:10.2.0
    container_name: showbee-grafana
    restart: always
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: showbee123
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/showbee-dashboard.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
