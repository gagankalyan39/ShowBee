global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'showbee-monolith'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:5001']
        labels:
          architecture: 'monolith'

  - job_name: 'showbee-booking-microservice'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:5002']
        labels:
          architecture: 'microservice'
